    provides:
      - verification contracts
      - governed test harnesses
      - reproducible closed-loop testing
      - trace-linked failure diagnosis
      - release gates
      - re-verification
    relates_to:
      - praxovela
      - rheovela
      - kinetovela
      - peiravela
    tags:
      - assurance
      - verification
      - testing
      - apache-2-0

  - id: peiravela
    name: PEIRAVELA
    kind: assurance
    layer: assurance
