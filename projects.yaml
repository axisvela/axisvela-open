    value: >-
      An evidence-bearing, bitemporal operational world model and digital twin.
    provides:
      - tenant-scoped world models
      - evidence-bearing assertions
      - bitemporal state
      - twin state, snapshots, and changes
      - SDKs
    relates_to:
      - gnosivela
      - orchadyn
      - peiravela
      - tekmovela
      - kinetovela
    tags:
      - digital-twin
      - world-model
      - bitemporal
      - evidence

  - id: limenora
    name: LIMENORA
    kind: gateway
    layer: boundary
    repo: https://github.com/axisvela/limenora-open
    license: Apache-2.0
    language: Go
    status: active
    open_surface: true
    problem: >-
      Direct external access by agents bypasses policy, spreads credentials,
      and leaves no reliable record.
    value: >-
      A governed north-south boundary for APIs, MCP servers, events, and
      webhooks.
    provides:
      - edge and enterprise gateways
      - HTTP proxy, CONNECT, webhooks, event ingress
      - policy enforcement
      - credential injection
      - evidence
    relates_to:
      - praxo-core
      - praxovela
      - rheovela
      - aegivela
    tags:
      - integration
      - gateway
      - mcp
      - apache-2-0

  - id: tekmovela
    name: TEKMOVELA
    kind: assurance
    layer: assurance
    repo: https://github.com/axisvela/tekmovela-open
    license: Apache-2.0
    language: Go
    status: active
    open_surface: true
