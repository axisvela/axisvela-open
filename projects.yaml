      - governed simulation worlds
      - reproducible scenario matrices
      - simulation evidence
      - independent verification
      - Studio UI and API
    relates_to:
      - ontovela
      - gnosivela
      - tekmovela
      - kinetovela
    tags:
      - simulation
      - experiments
      - evidence
      - apache-2-0

  - id: syndovela
    name: SYNDOVELA
    kind: assurance
    layer: assurance
