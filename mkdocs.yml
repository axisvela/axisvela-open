site_name: AxisVela Open
site_description: A public map of independent projects for governed autonomy.
site_url: https://axisvela.github.io/axisvela-open/
repo_url: https://github.com/axisvela/axisvela-open
repo_name: axisvela/axisvela-open
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Start here: start-here.md
  - Products & projects:
      - Index: projects/index.md
      - Foundation:
          - PRAXO-CORE: projects/praxo-core.md
          - Harmovela: projects/harmovela.md
          - Harmovela Open: projects/harmovela-open.md
          - COORDIVELA: projects/coordivela.md
      - Design and standards:
          - TAXOVELA: projects/taxovela.md
          - PAMP: projects/pamp.md
          - ea-harness (related): projects/ea-harness.md
      - Runtime and cognition:
          - PRAXOVELA: projects/praxovela.md
          - Mnemovela: projects/mnemovela.md
          - Noetivela: projects/noetivela.md
      - Work and capabilities:
          - ORCHADYN: projects/orchadyn.md
          - MODUREGIS: projects/moduregis.md
          - RHEOVELA: projects/rheovela.md
      - Trust and knowledge:
          - EIDOVELA: projects/eidovela.md
          - NOMIVELA: projects/nomivela.md
          - AEGIVELA: projects/aegivela.md
          - GNOSIVELA: projects/gnosivela.md
          - ONTOVELA: projects/ontovela.md
      - Boundary and assurance:
          - LIMENORA: projects/limenora.md
          - TEKMOVELA: projects/tekmovela.md
          - PEIRAVELA: projects/peiravela.md
          - SYNDOVELA: projects/syndovela.md
      - Human and physical:
          - SYMBIVELA: projects/symbivela.md
          - KINETOVELA: projects/kinetovela.md
      - Program:
          - Enterprise Autonomy: projects/enterprise-autonomy.md
  - Agent theory:
      - Overview: theory/index.md
      - Unified Agent Dynamics: theory/uad.md
      - DIKCA: theory/dikca.md
      - Intent, AOP, and control: theory/intent-aop.md
      - PPES: theory/ppes.md
      - Agent taxonomy: theory/agent-taxonomy.md
      - Multi-agent dynamics: theory/multi-agent-dynamics.md
      - Autonomy and architecture: theory/autonomy-architecture.md
      - Agent economics: theory/economics.md
      - Research map: theory/research-map.md
  - Agent architecture:
      - Overview: architecture/index.md
      - Reference architecture: architecture/reference-architecture.md
      - Runtime: architecture/runtime.md
      - Control planes: architecture/control-planes.md
      - Contracts: architecture/contracts.md
      - Knowledge: architecture/knowledge.md
      - Evidence: architecture/evidence.md
      - Deployment: architecture/deployment.md
      - Security: architecture/security.md
      - Ecosystem map: ecosystem-map.md
  - Agent practice:
      - Overview: practice/index.md
      - Build an agent: practice/build-an-agent.md
      - Govern an agent: practice/govern-an-agent.md
      - Memory and context: practice/memory-and-context.md
      - Durable process: practice/durable-process.md
      - Connect external systems: practice/connect-external-systems.md
      - Verify and simulate: practice/verify-and-simulate.md
      - End to end: practice/end-to-end.md
      - Adoption path: practice/adoption.md
